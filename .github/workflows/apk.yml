name: apk
on: workflow_dispatch
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: bash build.sh
      - run: cd android-app && gradle assembleDebug --no-daemon
      - run: gh release create v${{ github.run_number }} android-app/app/build/outputs/apk/debug/app-debug.apk --title "v${{ github.run_number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
